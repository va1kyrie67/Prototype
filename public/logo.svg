<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a6fc4"/>
      <stop offset="50%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
  </defs>
  
  <!-- Circular background -->
  <circle cx="40" cy="40" r="36" fill="url(#blueGrad)" opacity="0.9"/>
  
  <!-- Bar chart -->
  <rect x="14" y="48" width="7" height="16" rx="1" fill="url(#barGrad)" opacity="0.7"/>
  <rect x="24" y="38" width="7" height="26" rx="1" fill="url(#barGrad)" opacity="0.8"/>
  <rect x="34" y="30" width="7" height="34" rx="1" fill="url(#barGrad)" opacity="0.9"/>
  <rect x="44" y="22" width="7" height="42" rx="1" fill="url(#barGrad)"/>
  
  <!-- Upward arrow -->
  <path d="M52 18 L62 8 L62 14 L68 14 L68 22 L62 22 L62 28 Z" fill="url(#arrowGrad)"/>
  
  <!-- Text: PriorityPlus -->
  <text x="88" y="42" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1565c0">
    Priority<tspan fill="#1976d2">Plus</tspan>
  </text>
  
  <!-- Text: Financial -->
  <text x="88" y="62" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5a6a7a" letter-spacing="0.5">
    Financial
  </text>
</svg>
